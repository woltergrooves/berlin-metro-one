# Publishes docs/wiki/ to this repo's GitHub wiki (16 Nov 2026).
# Requires the wiki to exist (first page created once via the website).
name: Update wiki
on:
  push:
    branches: [fase-1, main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: wiki, cancel-in-progress: false }
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy pages to the wiki
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -m "Update wiki from docs/wiki (${GITHUB_SHA::7})"
          git push
